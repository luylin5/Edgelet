<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>Edgelet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="collapsed" data-edge="right" data-view="apps">
  <div id="handle"></div>
  <div id="panel">
    <header id="bar">
      <div id="views" role="tablist" aria-label="切换页面">
        <span class="thumb"></span>
        <button data-view="apps" role="tab" title="启动" aria-label="启动">
          <svg viewBox="0 0 16 16" width="13" height="13"><rect x="2" y="2" width="5" height="5" rx="1.3"/><rect x="9" y="2" width="5" height="5" rx="1.3"/><rect x="2" y="9" width="5" height="5" rx="1.3"/><rect x="9" y="9" width="5" height="5" rx="1.3"/></svg>
        </button>
        <button data-view="memo" role="tab" title="备忘" aria-label="备忘">
          <svg viewBox="0 0 16 16" width="13" height="13" class="stroke"><path d="M2.5 4.2l1.3 1.3 2.4-2.6M8.5 4.5h5M2.5 10.2l1.3 1.3 2.4-2.6M8.5 10.5h5"/></svg>
        </button>
      </div>
      <button id="more" title="菜单" aria-label="菜单">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
      </button>
    </header>
    <div id="grid"></div>
    <div id="empty">把软件、文件或文件夹<br>拖到这里</div>
    <div id="memo">
      <div id="memo-list"></div>
      <form id="memo-form" autocomplete="off">
        <div id="due-row"></div>
        <input id="memo-input" maxlength="500" placeholder="添加备忘，如「周五下午3点 开会」" spellcheck="false">
      </form>
      <div id="due-picker" hidden>
        <div class="picker-head cal-nav" id="due-head">
          <button id="cal-prev" title="上个月" aria-label="上个月"><svg viewBox="0 0 10 10"><path d="M6.5 2l-3 3 3 3"/></svg></button>
          <span id="cal-month"></span>
          <button id="cal-next" title="下个月" aria-label="下个月"><svg viewBox="0 0 10 10"><path d="M3.5 2l3 3-3 3"/></svg></button>
          <button id="due-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 16 16" width="12" height="12"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
          </button>
        </div>
        <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="cal-grid"></div>
        <div id="due-date"></div>
        <div id="due-wheel" title="滚轮、拖动或方向键调整时间，双击直接输入">
          <div class="wheel-col" id="wheel-h" tabindex="0" aria-label="小时"></div>
          <span class="wheel-sep">:</span>
          <div class="wheel-col" id="wheel-m" tabindex="0" aria-label="分钟"></div>
          <input id="wheel-input" hidden maxlength="8" placeholder="如 9:30" spellcheck="false" aria-label="输入时间">
        </div>
        <div class="due-times" id="due-times"></div>
        <div class="due-foot">
          <span class="due-hint" id="due-hint"></span>
          <button id="due-clear" class="ghost">清除</button>
          <button id="due-ok" class="primary">确定</button>
        </div>
      </div>
    </div>
    <div id="drop-hint"><span>松开以添加</span></div>
    <div id="picker" hidden>
      <div class="picker-head">
        <span id="picker-title">更换图标</span>
        <button id="picker-close" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 16 16" width="12" height="12"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
        </button>
      </div>
      <div id="picker-body"></div>
    </div>
    <div id="toast"></div>
  </div>
  <script src="presets.js"></script>
  <script src="dates.js"></script>
  <script src="app.js"></script>
</body>
</html>
